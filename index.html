<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>有機クラフト工房 - 高校化学 有機化合物</title>
  <meta name="description" content="高等学校学習指導要領（化学・有機化合物）に準拠した、ポーションクラフト型の有機化学合成シミュレーション教材。" />
  <meta property="og:title" content="有機クラフト工房 - 高校化学 有機化合物" />
  <meta property="og:description" content="高等学校学習指導要領（化学・有機化合物）に準拠した、ポーションクラフト型の有機化学合成シミュレーション教材。" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">

  <style>
  :root {
    --ground: #E9EDEA; --surface: #FBFCFA; --surface-2: #F1F4F1;
    --ink: #17232A; --ink-2: #4B5B63; --ink-3: #7F8E93; --line: #D3DBD7; --line-2: #AEBBB5;
    --accent: #2F49C5; --accent-soft: #E6EAFB; --accent-ink: #FFFFFF;
    --flame: #C95F22; --flame-soft: #FBEADF; --gold: #B7861B;
    --ok: #23734A; --ok-soft: #E0F1E6; --bad: #B42318;
    --c-alkane: #5B6B7A; --c-alkene: #2F49C5; --c-alkyne: #7A3FB8; --c-halide: #23734A;
    --c-polymer: #A66A12; --c-alcohol: #C2410C; --c-aldehyde: #B91C1C; --c-ketone: #7E22CE; --c-acid: #047857; --c-ester: #B45309; --c-aroma: #0E7490; --c-reagent: #6B7280; --c-inorg: #6B7280;
    --mol-c: #17232A; --mol-o: #C0392B; --mol-cl: #1E7A47; --mol-br: #A0461A;
    --liquid: #C9D3F5; --fog: #E2E8E4;
    --shadow: 0 1px 0 rgba(23,35,42,.05), 0 8px 24px -16px rgba(23,35,42,.3);
    --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0E1316; --surface: #172026; --surface-2: #1E2930;
      --ink: #E2EAE6; --ink-2: #A3B4AE; --ink-3: #72847F; --line: #2B3940; --line-2: #3C4D55;
      --accent: #8FA2FF; --accent-soft: #232C52; --accent-ink: #0E1316;
      --flame: #F08A4B; --flame-soft: #3A2418; --gold: #E8B84A;
      --ok: #62C48E; --ok-soft: #173026; --bad: #F58B80;
      --c-alkane: #9AABB9; --c-alkene: #8FA2FF; --c-alkyne: #B98CF0; --c-halide: #62C48E;
      --c-polymer: #E3A646; --c-alcohol: #F59A6B; --c-aldehyde: #F87171; --c-ketone: #C084FC; --c-acid: #34D399; --c-ester: #FBBF24; --c-aroma: #4CC3DB; --c-reagent: #A3ACB5; --c-inorg: #A3ACB5;
      --mol-c: #E2EAE6; --mol-o: #FF8A7A; --mol-cl: #62C48E; --mol-br: #F0A06A;
      --liquid: #2B3766; --fog: #131A1E;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0E1316; --surface: #172026; --surface-2: #1E2930;
    --ink: #E2EAE6; --ink-2: #A3B4AE; --ink-3: #72847F; --line: #2B3940; --line-2: #3C4D55;
    --accent: #8FA2FF; --accent-soft: #232C52; --accent-ink: #0E1316;
    --flame: #F08A4B; --flame-soft: #3A2418; --gold: #E8B84A;
    --ok: #62C48E; --ok-soft: #173026; --bad: #F58B80;
    --c-alkane: #9AABB9; --c-alkene: #8FA2FF; --c-alkyne: #B98CF0; --c-halide: #62C48E;
    --c-polymer: #E3A646; --c-alcohol: #F59A6B; --c-aldehyde: #F87171; --c-ketone: #C084FC; --c-acid: #34D399; --c-ester: #FBBF24; --c-aroma: #4CC3DB; --c-reagent: #A3ACB5; --c-inorg: #A3ACB5;
    --mol-c: #E2EAE6; --mol-o: #FF8A7A; --mol-cl: #62C48E; --mol-br: #F0A06A;
    --liquid: #2B3766; --fog: #131A1E;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65; margin: 0; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn.hot { background: var(--flame); border-color: var(--flame); color: #fff; font-weight: 700; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  /* header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.1; margin: 0; letter-spacing: .02em; }
  .brand h1 .c { color: var(--accent); }
  .brand > span { font-size: 13px; color: var(--ink-2); }
  .hud { display: flex; align-items: center; gap: 10px; }
  .rank { display: grid; gap: 3px; min-width: 150px; }
  .rank .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
  .rank b { font-weight: 700; }
  .rank small { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
  .xpbar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s ease; }
  .stars { font-family: var(--f-mono); font-size: 17px; font-weight: 500; color: var(--gold); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; }
  .easy-tag { font-size: 11px; background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); padding: 2px 8px; border-radius: 999px; font-weight: 700; }
  .menu { position: relative; }
  .menu summary { list-style: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: grid; gap: 6px; min-width: 250px; }
  .menu .pop button { text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 7px 10px; font-size: 13.5px; }
  .menu .pop button:hover { background: var(--surface-2); }
  .menu .pop p { margin: 4px 10px; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }

  /* quest bar */
  .qbar { padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; }
  @media (max-width: 640px) { .qbar { grid-template-columns: 1fr; } }
  .qbar .eyebrow { font-size: 11.5px; color: var(--ink-3); letter-spacing: .08em; }
  .qbar h2 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4; }
  .qbar .say { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); }
  .qbar .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .qbar ol { grid-column: 1 / -1; margin: 4px 0 0; padding-left: 1.3em; font-size: 13px; color: var(--ink-2); }
  .qbar.clear h2 { font-family: var(--f-display); font-weight: 400; color: var(--accent); font-size: 19px; }

  /* stage */
  .stage { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  @media (min-width: 980px) { .stage { grid-template-columns: minmax(0, 1fr) 360px; } }
  .mapcard { padding: 6px; overflow: hidden; }
  .map-scroll { overflow-x: auto; border-radius: 10px; background: var(--fog); }
  .map-scroll svg { display: block; width: 100%; min-width: 560px; aspect-ratio: 16/10; height: auto; }
  .maphead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 10px 8px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
  .maphead b { font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--ink); letter-spacing: .04em; margin-right: 8px; }
  .maphead .lgd { display: flex; gap: 12px; flex-wrap: wrap; }
  .maphead .lgd span { display: inline-flex; align-items: center; gap: 5px; }
  .lg { display: inline-block; width: 16px; height: 9px; border-radius: 4px; border: 1.5px solid var(--ink-2); background: var(--surface); }
  .lg.q { border-color: var(--accent); border-style: dashed; background: var(--accent-soft); }
  .lg.n { border-color: var(--flame); background: var(--flame-soft); }
  .region { font-family: var(--f-display); font-size: 14px; fill: var(--ink-3); opacity: .45; letter-spacing: .12em; }
  .ed { fill: none; stroke: var(--line-2); stroke-width: 1.8; }
  .ed.front { stroke: var(--accent); stroke-dasharray: 5 5; opacity: .7; }
  .ed.alt { stroke: var(--ink-3); stroke-dasharray: 2 5; opacity: .7; }
  .ed.hl { stroke: var(--ink-2); stroke-width: 2.4; opacity: 1; }
  .chip-bg { fill: var(--surface); stroke: var(--line-2); }
  .chip-t { font-family: var(--f-mono); font-size: 11.5px; fill: var(--ink-2); }
  .mn { cursor: pointer; }
  .mn rect.body { fill: var(--surface); stroke: var(--cc); stroke-width: 1.8; }
  .mn text { font-family: var(--f-body); font-size: 15px; font-weight: 500; fill: var(--ink); }
  .mn text.t-name { font-family: var(--f-body); font-size: 12.5px; font-weight: 700; fill: var(--ink); }
  .mn text.t-formula { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; fill: var(--cc); }
  .mn text.t-single { font-family: var(--f-body); font-size: 14px; font-weight: 500; fill: var(--ink); }
  .mn text.t-formula-only { font-family: var(--f-mono); font-size: 13.5px; font-weight: 700; fill: var(--cc); }
  .mn.raw rect.body { fill: var(--surface-2); stroke-width: 2.2; }
  .mn.locked { opacity: .55; }
  .mn.locked rect.body { stroke: var(--line-2); stroke-dasharray: 3 3; fill: transparent; }
  .mn.locked text { fill: var(--ink-3); font-size: 12.5px; }
  .mn.front rect.body { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 5 3; }
  .mn.front text { fill: var(--accent); font-family: var(--f-mono); letter-spacing: .12em; }
  .mn.sel rect.body { stroke-width: 3.2; }
  .halo { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; }
  .mn.front .halo { opacity: .3; }
  .mn.next .halo { stroke: var(--flame); opacity: .9; stroke-width: 2.6; }
  .flag rect { fill: var(--flame); }
  .flag text { fill: #fff; font-size: 11.5px; font-weight: 700; font-family: var(--f-body); }
  @keyframes pulse { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }
  .mn.front .halo { animation: pulse 1.8s ease-in-out infinite; }
  .mn.next .halo { animation: pulse 1.1s ease-in-out infinite; }

  /* side panel */
  .side { display: flex; flex-direction: column; min-height: 100%; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); }
  .seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
  .seg button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .side-b { padding: 16px; }
  .eyebrow { font-size: 11.5px; color: var(--ink-3); letter-spacing: .1em; }
  .side-b h3 { margin: 2px 0 4px; font-size: 18px; font-weight: 700; line-height: 1.35; }
  .side-b p { margin: 8px 0 0; font-size: 14px; }
  .fm { font-family: var(--f-mono); font-size: 14px; color: var(--cc); }
  .rar { color: var(--gold); font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .05em; }
  .muted { color: var(--ink-3); }
  .route { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 12px; }
  .route .rh { font-size: 11.5px; color: var(--ink-3); letter-spacing: .08em; margin-bottom: 6px; }
  .route dl { display: grid; grid-template-columns: 4em 1fr; gap: 6px 8px; margin: 0; font-size: 14px; align-items: center; }
  .route dt { color: var(--ink-3); font-size: 12.5px; }
  .route dd { margin: 0; }
  .hid { font-family: var(--f-mono); color: var(--ink-3); letter-spacing: .2em; }
  .spend { border: 1px solid var(--gold); color: var(--gold); background: transparent; border-radius: 999px; font-size: 12px; padding: 1px 10px; margin-left: 8px; font-weight: 700; }
  .spend:disabled { opacity: .4; cursor: not-allowed; }
  .nextbox { border-left: 3px solid var(--flame); border-radius: 0; padding: 4px 0 4px 12px; margin-top: 14px; font-size: 13.5px; }
  .nextbox b { color: var(--flame); }

  /* bench */
  .slots { display: grid; grid-template-columns: 1fr 72px 1fr; gap: 8px; align-items: center; }
  .slot { min-height: 70px; border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 8px 10px; background: var(--surface-2); text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px; position: relative; width: 100%; }
  .slot.filled { border-style: solid; background: var(--surface); }
  .slot.active { border-color: var(--accent); border-style: solid; background: var(--accent-soft); }
  .slot .lab { font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em; }
  .slot .nm { font-weight: 700; font-size: 14px; line-height: 1.3; }
  .slot .sf { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
  .slot .empty { color: var(--ink-3); font-size: 12.5px; }
  .flask-wrap { width: 72px; height: 82px; }
  .flask-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .picker { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface-2); }
  .picker .ph { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
  .picker h4 { margin: 8px 0 4px; font-size: 11.5px; color: var(--ink-3); font-weight: 500; letter-spacing: .08em; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 13px; line-height: 1.4; }
  .tag:hover { border-color: var(--line-2); }
  .tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cc, var(--c-reagent)); flex: none; }
  .tag .tf { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
  .tag.on { border-color: var(--accent); background: var(--accent-soft); }
  .conds { display: grid; gap: 12px; margin-top: 14px; }
  .cond label, .cond .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); letter-spacing: .04em; margin-bottom: 4px; }
  .cond .val { font-family: var(--f-mono); font-size: 14px; color: var(--ink); }

  /* enhanced temp control */
  .temp-cond { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .temp-head { display: flex; justify-content: space-between; align-items: center; }
  .temp-title-row { display: flex; align-items: center; gap: 8px; }
  .temp-label { font-size: 13px; font-weight: 700; color: var(--ink); }
  .temp-zone-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); transition: all .2s; }
  .temp-val-wrap .val { font-family: var(--f-mono); font-size: 18px; font-weight: 700; color: var(--flame); letter-spacing: .02em; }
  .temp-hint { font-size: 11.5px; color: var(--ink-2); line-height: 1.35; min-height: 16px; margin-top: -3px; }
  .temp-presets { display: flex; flex-wrap: wrap; gap: 4px; }
  .t-pre { background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 7px; font-size: 11px; font-weight: 500; color: var(--ink-2); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .t-pre:hover { border-color: var(--flame); color: var(--ink); background: var(--surface); }
  .t-pre.active { background: var(--flame-soft); border-color: var(--flame); color: var(--flame); font-weight: 700; }
  .temp-slider-row { display: flex; align-items: center; gap: 8px; }
  .temp-step-btn { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 4px 8px; font-family: var(--f-mono); font-size: 12px; font-weight: 700; color: var(--ink-2); cursor: pointer; flex: none; min-width: 44px; text-align: center; transition: all .15s; }
  .temp-step-btn:hover { background: var(--surface-2); border-color: var(--ink-2); color: var(--ink); }
  .temp-track-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .temp-track-wrap input[type=range] { width: 100%; height: 8px; border-radius: 4px; background: linear-gradient(to right, #38bdf8 0%, #fb923c 10%, #ef4444 20%, #b91c1c 45%, #7e22ce 85%); outline: none; accent-color: var(--flame); cursor: pointer; }
  .temp-ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-3); padding: 0 2px; user-select: none; }
  .temp-ticks span { cursor: pointer; transition: color .15s; }
  .temp-ticks span:hover { color: var(--flame); font-weight: 700; }

  input[type=range] { width: 100%; accent-color: var(--flame); }
  select { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); }
  .row2 { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: end; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 14px 6px 9px; font-size: 13px; white-space: nowrap; }
  .toggle .bulb { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--ink-3); transition: .2s; }
  .toggle[aria-pressed="true"] { border-color: #8B5CF6; background: rgba(139,92,246,.12); }
  .toggle[aria-pressed="true"] .bulb { background: #8B5CF6; border-color: #8B5CF6; box-shadow: 0 0 0 4px rgba(139,92,246,.2); }
  .go { margin-top: 14px; width: 100%; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 17px; letter-spacing: .1em; padding: 11px; }
  .go:hover { filter: brightness(1.07); }
  .err { color: var(--bad); font-size: 13px; margin-top: 6px; }
  .result { margin-top: 14px; border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
  .result.ok { background: var(--ok-soft); }
  .result.fail { background: var(--flame-soft); }
  .result h4 { margin: 0; font-size: 15px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; border-radius: 6px; padding: 1px 7px; border: 1px solid currentColor; background: transparent; }
  .chip.type { color: var(--accent); cursor: pointer; }
  .chip.type:hover { background: var(--accent-soft); }
  .chip.good { color: var(--ok); }
  .chip.miss { color: var(--ink-3); }
  .chip.xp { color: var(--gold); }
  .eq { font-family: var(--f-mono); font-size: 13.5px; margin: 8px 0 0; overflow-x: auto; white-space: nowrap; }
  .result p { margin: 6px 0 0; font-size: 13.5px; }
  .result .tn { font-size: 12px; color: var(--ink-2); }

  /* lower tabs */

  .toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 20; width: min(420px, calc(100vw - 32px)); pointer-events: none; }

            <b>合成マップ</b>
            <span id="map-sub"></span>
            <button type="button" class="btn" id="toggle-map-mode" style="padding:2px 8px;font-size:11.5px">表示: 名称＋化学式</button>
          </span>
          <span class="lgd">
            <span><i class="lg"></i>発見済み</span>
            <span><i class="lg q"></i>作れそう</span>
            <span><i class="lg n"></i>次の一歩</span>
          </span>
        </div>
        <div class="map-scroll">
          <svg id="map" viewBox="0 0 980 612" role="img" aria-label="合成マップ"></svg>
        </div>
      </section>

      <section class="panel side" id="side">
        <div class="seg" role="tablist">
          <button type="button" role="tab" id="seg-look" data-side="look" aria-selected="true">調べる</button>
          <button type="button" role="tab" id="seg-bench" data-side="bench" aria-selected="false">反応台</button>
        </div>
        <div class="side-b" id="look"></div>
        <div class="side-b" id="bench" hidden>
          <div class="slots">
            <button type="button" class="slot" id="slot-a" data-slot="a"></button>
            <div class="flask-wrap" id="flask" aria-hidden="true">
              <svg viewBox="0 0 150 170">
                <g class="uv">
                  <line x1="18" y1="18" x2="44" y2="52" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
                  <circle cx="12" cy="12" r="9" fill="#8B5CF6" opacity=".85"/>
                </g>
                <defs>
                  <clipPath id="fclip">
                    <path d="M60 14 H90 V62 L128 138 Q132 150 120 150 H30 Q18 150 22 138 L60 62 Z"/>
                  </clipPath>
                </defs>
                <g clip-path="url(#fclip)">
                  <rect id="liquid" x="0" y="96" width="150" height="60" fill="var(--liquid)"/>
                  <circle class="bub" cx="62" cy="140" r="5" fill="var(--surface)"/>
                  <circle class="bub" cx="80" cy="144" r="4" fill="var(--surface)"/>
                  <circle class="bub" cx="94" cy="138" r="6" fill="var(--surface)"/>
                  <circle class="bub" cx="72" cy="146" r="4" fill="var(--surface)"/>
                </g>
                <path d="M60 14 H90 V62 L128 138 Q132 150 120 150 H30 Q18 150 22 138 L60 62 Z" fill="none" stroke="var(--ink-2)" stroke-width="4" stroke-linejoin="round"/>
                <circle class="smoke" cx="75" cy="4" r="12" fill="var(--ink-3)"/>
                <g class="flame-g">
                  <path d="M52 170 Q58 150 64 158 Q70 144 76 170 Z" fill="var(--flame)"/>
                  <path d="M74 170 Q80 146 86 156 Q92 142 98 170 Z" fill="var(--flame)" opacity=".8"/>
                </g>
              </svg>
            </div>
            <button type="button" class="slot" id="slot-b" data-slot="b"></button>
          </div>
          <div id="picker"></div>
          <div class="conds">
            <div class="cond temp-cond">
              <div class="temp-head">
                <div class="temp-title-row">
                  <span class="temp-label">加熱温度</span>
                  <span class="temp-zone-badge" id="temp-zone">室温</span>
                </div>
                <div class="temp-val-wrap">
                  <span class="val" id="temp-v">20℃</span>
                </div>
              </div>
              <div class="temp-hint" id="temp-hint" style="display:none"></div>
              <div class="temp-presets" id="temp-presets">
                <button type="button" class="t-pre active" data-temp="20">室温 20℃</button>
                <button type="button" class="t-pre" data-temp="60">湯せん 60℃</button>
                <button type="button" class="t-pre" data-temp="140" id="t-pre-140">140℃</button>
                <button type="button" class="t-pre" data-temp="170" id="t-pre-170">170℃</button>
                <button type="button" class="t-pre" data-temp="300">300℃</button>
                <button type="button" class="t-pre" data-temp="500">500℃</button>
                <button type="button" class="t-pre" data-temp="800">800℃</button>
              </div>
              <div class="temp-slider-row">
                <button type="button" class="temp-step-btn" id="temp-down" aria-label="温度を10℃下げる">−10℃</button>
                <div class="temp-track-wrap">
                  <input type="range" id="temp" min="20" max="900" step="10" value="20" aria-label="加熱温度スライダー">
                  <div class="temp-ticks">
                    <span data-temp="20">20℃</span>
                    <span data-temp="60">60℃</span>
                    <span data-temp="140">140℃</span>
                    <span data-temp="170">170℃</span>
                    <span data-temp="300">300℃</span>
                    <span data-temp="500">500℃</span>
                    <span data-temp="800">800℃</span>
                  </div>
                </div>
                <button type="button" class="temp-step-btn" id="temp-up" aria-label="温度を10℃上げる">＋10℃</button>
              </div>
            </div>
            <div class="row2">
              <div class="cond">
                <span class="lbl">光</span>
                <button type="button" class="toggle" id="light" aria-pressed="false">
                  <span class="bulb"></span>
                  <span id="light-t">当てない</span>
                </button>
              </div>
              <div class="cond"><label for="cat">触媒</label><select id="cat"></select></div>
            </div>
            <div class="cond">
              <label for="pred" style="display:flex;justify-content:space-between;align-items:center">
                <span>反応の種類を予想<span class="muted">（当たると★）</span></span>
                <button type="button" class="btn ghost" id="explain-terms-btn" style="padding:1px 6px;font-size:11px;text-decoration:underline">反応の種類とは？</button>
              </label>
              <select id="pred"></select>
            </div>
          </div>
          <button type="button" class="go" id="go">反応させる</button>
          <div class="err" id="err" role="alert"></div>
          <div id="result"></div>
        </div>
      </section>
    </div>

    <!-- 探偵モード（構造決定事件簿）ステージ -->
    <section class="detective-stage" id="detective-stage" style="display:none"></section>

    <section class="panel lower">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="dex" aria-selected="true">物質図鑑<small id="t-dex"></small></button>
        <button type="button" role="tab" data-tab="rx" aria-selected="false">反応図鑑<small id="t-rx"></small></button>
        <button type="button" role="tab" data-tab="ach" aria-selected="false">称号<small id="t-ach"></small></button>
        <button type="button" role="tab" data-tab="log" aria-selected="false">実験ノート<small id="t-log"></small></button>
        <button type="button" role="tab" data-tab="det" aria-selected="false">🕵️ 事件簿<small id="t-det"></small></button>
      </div>
      <div class="tb" id="tabbody"></div>
    </section>
  </div>

  <dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
  <dialog id="disc"><div class="card" id="disc-body"></div></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.1.7/dist/smiles-drawer.min.js"></script>
  <script type="module">
    import { initCraftApp } from '/src/craft-app.js';
    initCraftApp();
  </script>
</body>
</html>
