<title>有機クラフト工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#E9EDEA; --surface:#FBFCFA; --surface-2:#F1F4F1;
  --ink:#17232A; --ink-2:#4B5B63; --ink-3:#7F8E93; --line:#D3DBD7; --line-2:#AEBBB5;
  --accent:#2F49C5; --accent-soft:#E6EAFB; --accent-ink:#FFFFFF;
  --flame:#C95F22; --flame-soft:#FBEADF; --gold:#B7861B;
  --ok:#23734A; --ok-soft:#E0F1E6; --bad:#B42318;
  --c-alkane:#5B6B7A; --c-alkene:#2F49C5; --c-alkyne:#7A3FB8; --c-halide:#23734A;
  --c-polymer:#A66A12; --c-alcohol:#C2410C; --c-aroma:#0E7490; --c-reagent:#6B7280; --c-inorg:#6B7280;
  --mol-c:#17232A; --mol-o:#C0392B; --mol-cl:#1E7A47; --mol-br:#A0461A;
  --liquid:#C9D3F5; --fog:#E2E8E4;
  --shadow:0 1px 0 rgba(23,35,42,.05), 0 8px 24px -16px rgba(23,35,42,.3);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1316; --surface:#172026; --surface-2:#1E2930;
    --ink:#E2EAE6; --ink-2:#A3B4AE; --ink-3:#72847F; --line:#2B3940; --line-2:#3C4D55;
    --accent:#8FA2FF; --accent-soft:#232C52; --accent-ink:#0E1316;
    --flame:#F08A4B; --flame-soft:#3A2418; --gold:#E8B84A;
    --ok:#62C48E; --ok-soft:#173026; --bad:#F58B80;
    --c-alkane:#9AABB9; --c-alkene:#8FA2FF; --c-alkyne:#B98CF0; --c-halide:#62C48E;
    --c-polymer:#E3A646; --c-alcohol:#F59A6B; --c-aroma:#4CC3DB; --c-reagent:#A3ACB5; --c-inorg:#A3ACB5;
    --mol-c:#E2EAE6; --mol-o:#FF8A7A; --mol-cl:#62C48E; --mol-br:#F0A06A;
    --liquid:#2B3766; --fog:#131A1E;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1316; --surface:#172026; --surface-2:#1E2930;
  --ink:#E2EAE6; --ink-2:#A3B4AE; --ink-3:#72847F; --line:#2B3940; --line-2:#3C4D55;
  --accent:#8FA2FF; --accent-soft:#232C52; --accent-ink:#0E1316;
  --flame:#F08A4B; --flame-soft:#3A2418; --gold:#E8B84A;
  --ok:#62C48E; --ok-soft:#173026; --bad:#F58B80;
  --c-alkane:#9AABB9; --c-alkene:#8FA2FF; --c-alkyne:#B98CF0; --c-halide:#62C48E;
  --c-polymer:#E3A646; --c-alcohol:#F59A6B; --c-aroma:#4CC3DB; --c-reagent:#A3ACB5; --c-inorg:#A3ACB5;
  --mol-c:#E2EAE6; --mol-o:#FF8A7A; --mol-cl:#62C48E; --mol-br:#F0A06A;
  --liquid:#2B3766; --fog:#131A1E;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.hot{background:var(--flame);border-color:var(--flame);color:#fff;font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:0;letter-spacing:.02em}
.brand h1 .c{color:var(--accent)}
.brand > span{font-size:13px;color:var(--ink-2)}
.hud{display:flex;align-items:center;gap:10px}
.rank{display:grid;gap:3px;min-width:150px}
.rank .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.rank b{font-weight:700}
.rank small{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.xpbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s ease}
.stars{font-family:var(--f-mono);font-size:17px;font-weight:500;color:var(--gold);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink-2);cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:grid;gap:4px;min-width:220px}
.menu .pop button{text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:13.5px}
.menu .pop button:hover{background:var(--surface-2)}
.menu .pop p{margin:4px 10px;font-size:11.5px;color:var(--ink-3);line-height:1.5}

/* quest bar */
.qbar{padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
@media (max-width:640px){.qbar{grid-template-columns:1fr}}
.qbar .eyebrow{font-size:11.5px;color:var(--ink-3);letter-spacing:.08em}
.qbar h2{margin:0;font-size:16px;font-weight:700;line-height:1.4}
.qbar .say{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.qbar .acts{display:flex;gap:8px;flex-wrap:wrap}
.qbar ol{grid-column:1/-1;margin:4px 0 0;padding-left:1.3em;font-size:13px;color:var(--ink-2)}
.qbar.clear h2{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:19px}
@media (prefers-reduced-motion:no-preference){ #deliver:not(:disabled){animation:beat 1.2s ease-in-out infinite} }
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* stage */
.stage{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:980px){.stage{grid-template-columns:minmax(0,1fr) 360px}}
.mapcard{padding:6px;overflow:hidden}
.map-scroll{overflow-x:auto;border-radius:10px;background:var(--fog)}
.map-scroll svg{display:block;width:100%;min-width:560px;aspect-ratio:16/10;height:auto}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 10px 8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.maphead b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--ink);letter-spacing:.04em;margin-right:8px}
.maphead .lgd{display:flex;gap:12px;flex-wrap:wrap}
.maphead .lgd span{display:inline-flex;align-items:center;gap:5px}
.lg{display:inline-block;width:16px;height:9px;border-radius:4px;border:1.5px solid var(--ink-2);background:var(--surface)}
.lg.q{border-color:var(--accent);border-style:dashed;background:var(--accent-soft)}
.lg.n{border-color:var(--flame);background:var(--flame-soft)}
.region{font-family:var(--f-display);font-size:14px;fill:var(--ink-3);opacity:.45;letter-spacing:.12em}
.ed{fill:none;stroke:var(--line-2);stroke-width:1.8}
.ed.front{stroke:var(--accent);stroke-dasharray:5 5;opacity:.7}
.ed.alt{stroke:var(--ink-3);stroke-dasharray:2 5;opacity:.7}
.ed.hl{stroke:var(--ink-2);stroke-width:2.4;opacity:1}
.chip-bg{fill:var(--surface);stroke:var(--line-2)}
.chip-t{font-family:var(--f-mono);font-size:11.5px;fill:var(--ink-2)}
.mn{cursor:pointer}
.mn rect.body{fill:var(--surface);stroke:var(--cc);stroke-width:1.8}
.mn text{font-family:var(--f-body);font-size:15px;font-weight:500;fill:var(--ink)}
.mn.raw rect.body{fill:var(--surface-2);stroke-width:2.2}
.mn.locked{opacity:.55}
.mn.locked rect.body{stroke:var(--line-2);stroke-dasharray:3 3;fill:transparent}
.mn.locked text{fill:var(--ink-3);font-size:12.5px}
.mn.front rect.body{fill:var(--accent-soft);stroke:var(--accent);stroke-dasharray:5 3}
.mn.front text{fill:var(--accent);font-family:var(--f-mono);letter-spacing:.12em}
.mn.sel rect.body{stroke-width:3.2}
.mn.dim{opacity:.4}
.halo{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.mn.front .halo{opacity:.3}
.mn.next .halo{stroke:var(--flame);opacity:.9;stroke-width:2.6}
.flag rect{fill:var(--flame)}
.flag text{fill:#fff;font-size:11.5px;font-weight:700;font-family:var(--f-body)}
@media (prefers-reduced-motion:no-preference){
  .mn.front .halo{animation:pulse 1.8s ease-in-out infinite}
  .mn.next .halo{animation:pulse 1.1s ease-in-out infinite}
}
@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.9}}

/* side panel */
.side{display:flex;flex-direction:column;min-height:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;border-bottom:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side-b{padding:16px}
.eyebrow{font-size:11.5px;color:var(--ink-3);letter-spacing:.1em}
.side-b h3{margin:2px 0 4px;font-size:18px;font-weight:700;line-height:1.35}
.side-b p{margin:8px 0 0;font-size:14px}
.fm{font-family:var(--f-mono);font-size:14px;color:var(--cc)}
.rar{color:var(--gold);font-family:var(--f-mono);font-size:12.5px;letter-spacing:.05em}
.muted{color:var(--ink-3)}
.route{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.route .rh{font-size:11.5px;color:var(--ink-3);letter-spacing:.08em;margin-bottom:6px}
.route dl{display:grid;grid-template-columns:4em 1fr;gap:6px 8px;margin:0;font-size:14px;align-items:center}
.route dt{color:var(--ink-3);font-size:12.5px}
.route dd{margin:0}
.hid{font-family:var(--f-mono);color:var(--ink-3);letter-spacing:.2em}
.spend{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;font-size:12px;padding:1px 10px;margin-left:8px;font-weight:700}
.spend:disabled{opacity:.4;cursor:not-allowed}
.nextbox{border-left:3px solid var(--flame);border-radius:0;padding:4px 0 4px 12px;margin-top:14px;font-size:13.5px}
.nextbox b{color:var(--flame)}

/* bench */
.slots{display:grid;grid-template-columns:1fr 72px 1fr;gap:8px;align-items:center}
.slot{min-height:70px;border:1.5px dashed var(--line-2);border-radius:12px;padding:8px 10px;background:var(--surface-2);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;position:relative;width:100%}
.slot.filled{border-style:solid;background:var(--surface)}
.slot.active{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.slot .lab{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em}
.slot .nm{font-weight:700;font-size:14px;line-height:1.3}
.slot .sf{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.slot .empty{color:var(--ink-3);font-size:12.5px}
.flask-wrap{width:72px;height:82px}
.flask-wrap svg{width:100%;height:100%;overflow:visible}
.picker{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.picker .ph{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.picker h4{margin:8px 0 4px;font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.08em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:13px;line-height:1.4}
.tag:hover{border-color:var(--line-2)}
.tag .dot{width:8px;height:8px;border-radius:50%;background:var(--cc,var(--c-reagent));flex:none}
.tag .tf{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.tag.on{border-color:var(--accent);background:var(--accent-soft)}
.conds{display:grid;gap:12px;margin-top:14px}
.cond label,.cond .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);letter-spacing:.04em;margin-bottom:4px}
.cond .val{font-family:var(--f-mono);font-size:14px;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--flame)}
select{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface)}
.row2{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px 6px 9px;font-size:13px;white-space:nowrap}
.toggle .bulb{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink-3);transition:.2s}
.toggle[aria-pressed="true"]{border-color:#8B5CF6;background:rgba(139,92,246,.12)}
.toggle[aria-pressed="true"] .bulb{background:#8B5CF6;border-color:#8B5CF6;box-shadow:0 0 0 4px rgba(139,92,246,.2)}
.go{margin-top:14px;width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:17px;letter-spacing:.1em;padding:11px}
.go:hover{filter:brightness(1.07)}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.result{margin-top:14px;border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.result.ok{background:var(--ok-soft)}
.result.fail{background:var(--flame-soft)}
.result h4{margin:0;font-size:15px;font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-block;font-size:11px;font-weight:500;border-radius:6px;padding:0 7px;border:1px solid currentColor}
.chip.type{color:var(--accent)} .chip.good{color:var(--ok)} .chip.miss{color:var(--ink-3)} .chip.xp{color:var(--gold)}
.eq{font-family:var(--f-mono);font-size:13.5px;margin:8px 0 0;overflow-x:auto;white-space:nowrap}
.result p{margin:6px 0 0;font-size:13.5px}
.result .tn{font-size:12px;color:var(--ink-2)}

/* lower tabs */
.lower .tabs{display:flex;gap:4px;padding:6px 6px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.lower .tabs button{border:0;background:transparent;padding:8px 14px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.lower .tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.lower .tabs small{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin-left:4px}
.lower .tb{padding:14px 16px 16px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.dex-i{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 6px;text-align:center;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dex-i .df{font-family:var(--f-mono);font-size:12px;color:var(--cc);font-weight:500;overflow-wrap:anywhere;line-height:1.3}
.dex-i .dn{font-size:12px;line-height:1.3}
.dex-i.unk{border-style:dashed;background:transparent;cursor:default}
.dex-i.unk .df,.dex-i.unk .dn{color:var(--ink-3)}
.dex-i:not(.unk):hover{border-color:var(--cc)}
.dex-sec{font-size:12px;color:var(--ink-3);letter-spacing:.08em;margin:16px 0 8px;display:flex;justify-content:space-between}
.dex-sec:first-child{margin-top:0}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.45}
.badge b{display:block;font-size:14px}
.badge span{color:var(--ink-3)}
.badge.on{border-color:var(--gold)}
.badge.on b{color:var(--gold)}
.badge.off b{color:var(--ink-3)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.log li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;font-size:13px;align-items:baseline;border-bottom:1px dotted var(--line);padding-bottom:6px}
.log .n{font-family:var(--f-mono);color:var(--ink-3)}
.log .e{font-family:var(--f-mono);overflow-wrap:anywhere}
.log .r.ok{color:var(--ok)} .log .r.no{color:var(--ink-3)}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,15,18,.55)}
.dlg{padding:18px 20px 20px}
.dlg-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg-h h3{margin:0;font-size:19px;font-weight:700;line-height:1.35}
.dlg .mol{background:var(--surface-2);border-radius:12px;margin:12px 0;display:flex;justify-content:center;padding:8px}
.dlg .mol svg{width:100%;max-width:320px;height:190px}
.poly{font-family:var(--f-mono);font-size:22px;padding:30px 8px;text-align:center}
.dlg dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.dlg dt{color:var(--ink-3);font-size:12.5px;padding-top:2px}
.dlg dd{margin:0}
.dlg ul{margin:0;padding-left:1.1em}
.dlg ul li{font-family:var(--f-mono);font-size:13px}
#disc{width:min(360px,calc(100vw - 32px));border:2px solid var(--gold)}
.card{padding:18px 20px 20px;text-align:center}
.card .new{font-family:var(--f-display);font-size:28px;color:var(--gold);letter-spacing:.12em;line-height:1}
.card .rar{font-size:16px;margin-top:6px;display:block}
.card .mol{background:var(--surface-2);border-radius:12px;margin:12px 0;padding:6px}
.card .mol svg{width:100%;height:160px;display:block}
.card .mol .poly{padding:52px 8px}
.card h3{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.card .cl{display:inline-block;margin-top:6px;font-size:11.5px;border:1px solid var(--cc);color:var(--cc);border-radius:6px;padding:0 8px}
.card p{font-size:13.5px;text-align:left;margin:10px 0 0}
.card .gain{display:flex;justify-content:center;gap:12px;margin-top:12px;font-family:var(--f-mono);font-size:13px;color:var(--gold)}
.card .lvl{margin-top:10px;background:var(--accent-soft);border-radius:10px;padding:8px;font-weight:700;color:var(--accent)}
.card .btn{margin-top:14px;width:100%;padding:9px}
@media (prefers-reduced-motion:no-preference){
  #disc[open]{animation:flip .55s cubic-bezier(.2,.9,.3,1.2)}
  .result{animation:fadein .3s ease}
}
@keyframes flip{from{transform:perspective(800px) rotateY(80deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;width:min(420px,calc(100vw - 32px));pointer-events:none}

/* rarity = steps from raw */
const DEPTH = (function(){
  const d = {}; SOURCES.forEach(s=>s.items.forEach(i=>d[i]=0));
  let ch = true;
  while(ch){ ch=false; RULES.forEach(r=>{ if(r.in.every(i=>d[i]!==undefined)){ const v=Math.max(...r.in.map(i=>d[i]))+1; r.out.forEach(o=>{ if(d[o]===undefined||d[o]>v){ d[o]=v; ch=true; } }); } }); }
  return d;
})();
const rarity = id => Math.max(1, Math.min(5, DEPTH[id]||1));

  if(r.cat) p.push("触媒：" + r.cat.map(c=>CATSHORT[c]).join(" または "));
  if(r.t) p.push(`温度 ${r.t[0]}〜${r.t[1]}℃`);
  return p.length ? p.join("／") : "特別な条件はいらない（室温でOK）";

function partnerText(r){
  const others = r.in.filter(i=>!POS[i]);
  return others.length ? others.map(i=>`${S[i].n.replace(/（.*）/,"")} ${S[i].f}`).join("＋") : "なし（フラスコBは空のまま）";
}
function edgeChip(r){
  const p = r.in.filter(i=>!POS[i]).map(i=>"+"+S[i].f);
  if(r.light) p.push("光");
  if(r.cat) p.push(r.cat.map(c=>CATSHORT[c]).join("/"));
  if(r.t) p.push(r.t[0]+"℃〜");
  return p.join(" ") || "室温";
}

    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = Object.assign({type:"triangle",dur:.13,gap:.09,vol:.08}, opt||{});
    freqs.forEach((f,i)=>{
      const t0 = actx.currentTime + i*o.gap;
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.type = o.type; osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(o.vol,t0+.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+o.dur);
      osc.connect(g).connect(actx.destination); osc.start(t0); osc.stop(t0+o.dur+.02);
    });
  }catch(e){}
}

/* ================= reaction engine ================= */
function resolve(){
  let ids = [ui.a, ui.b].filter(Boolean);
  if(ids.length===2 && ids[0]===ids[1]) ids = [ids[0]];
  const cands = RULES.filter(r=>sameSet(r.in, ids));
  const ok = r => {
    if(r.light && !ui.light) return false;
    if(r.cat && !r.cat.includes(ui.cat)) return false;
    const [lo,hi] = tRange(r); return ui.temp>=lo && ui.temp<=hi;
  };
  const hit = cands.find(ok);
  if(hit) return {kind:"ok", rule:hit};
  if(cands.length){
    const dist = r => { const [lo,hi]=tRange(r); return ui.temp<lo ? lo-ui.temp : ui.temp>hi ? ui.temp-hi : 0; };
    const r = cands.slice().sort((p,q)=>dist(p)-dist(q))[0];
    if(r.cat && !r.cat.includes(ui.cat)){
      if(r.cat.includes("poly") && !state.cat.poly) return {kind:"fail",rule:r,msg:"この反応には重合触媒が必要だが、まだ手に入っていない（依頼4で解放）。"};
      return {kind:"fail",rule:r,msg:(ui.cat==="none"?"何も起きない。":"この触媒では反応が進まない。")+(r.catMsg||"")};
    }
    if(r.light && !ui.light) return {kind:"fail",rule:r,msg:"暗いままでは何も起きない。アルカンと塩素の置換反応には、光（紫外線）が必要だ。"};
    const [lo] = tRange(r);
    if(ui.temp<lo) return {kind:"fail",rule:r,msg:r.lowMsg||"温度が低すぎて、反応が進まない。"};
    return {kind:"fail",rule:r,msg:r.highMsg||"温度が高すぎた。分解や副反応が起きて、目的の物質は得られなかった。",hot:true};
  }
  const set = new Set(ids);
  const other = ids.find(i=>i!=="br2"&&i!=="h2"&&i!=="cl2"&&i!=="o2");
  const oc = other && S[other].cls;
  if(set.has("br2") && oc==="alkane"){ state.flags.brNo = true; return {kind:"none",msg:"臭素水の赤褐色は消えなかった。アルカンは単結合だけ（飽和）なので、付加反応をしない。これが不飽和結合の見分け方になる。"}; }
  if(set.has("h2") && oc==="alkane") return {kind:"none",msg:"アルカンは飽和しているので、水素が付加する場所がない。"};
  if(set.has("cl2") && other==="propane" && ids.length===2) return {kind:"none",msg:"光を当てても、1-クロロプロパンと2-クロロプロパンなどが混ざってしまい、目的の物質を取り出せなかった。"};
  if(oc==="polymer") return {kind:"none",msg:"高分子は安定で、この条件では反応しにくい。"};
  if(set.has("o2") && oc && ["halide","alcohol"].includes(oc)) return {kind:"none",msg:"この工房では、炭化水素の燃焼だけを扱っている。"};
  if(ids.length===1 && S[ids[0]].cls==="reagent") return {kind:"none",msg:"試薬だけでは何も起きない。反応させる相手を入れよう。"};
  return {kind:"none",msg:"何も起きなかった。組み合わせか条件を変えてみよう。マップの「？？？」に手がかりがある。"};
}

function react(){
  $("err").textContent = "";
  if(!ui.a && !ui.b){ $("err").textContent = "フラスコ A に物質を入れてください。"; return; }
  const res = resolve();
  const pred = ui.pred;
  const rank0 = rankIdx(state.xp);
  let newSubs = [], newRx = false, predOk = null, star = 0, xp = 0;
  if(res.kind==="ok"){
    const r = res.rule;
    newRx = !state.rx[r.id];
    state.rx[r.id] = true;
    r.out.concat(r.give||[]).forEach(id=>{ if(!state.found[id]){ state.found[id]=true; if(r.out.includes(id)){ newSubs.push(id); xp += 10 + rarity(id)*10; } } });
    if(newRx) xp += 10;
    if(pred){ predOk = r.types.includes(pred); if(predOk && newRx){ star++; xp += 5; state.predN++; } }
  } else {
    state.fails++;
    if(pred) predOk = pred==="反応しない";
  }
  state.stars += star; state.xp += xp;
  state.n++;
  const eqText = res.kind==="ok" ? res.rule.eq : [ui.a,ui.b].filter(Boolean).map(i=>S[i].f).join(" + ") + " → ×";
  state.log.unshift({n:state.n, eq:eqText, ok:res.kind==="ok"});
  state.log = state.log.slice(0,30);
  const lvlUp = rankIdx(state.xp) > rank0 ? RANKS[rankIdx(state.xp)][1] : null;
  ui.result = {res, newSubs, newRx, predOk, star, pred, xp};
  if(newSubs.length){ ui.sel = newSubs[0]; }
  checkAch();
  save();
  animate(res);
  renderAll();
  if(res.kind==="ok"){ (newSubs.length?SFX.nw:SFX.ok)(); if(star) setTimeout(SFX.star,450); }
  else (res.kind==="fail"?SFX.fail:SFX.none)();
  if(newSubs.length) showDiscovery(newSubs, {xp, star, lvlUp});
  else if(lvlUp){ SFX.lvl(); toast(`ランクアップ！ <b>${lvlUp}</b> になった`); }
}

function checkAch(){
  ACH.forEach(a=>{
    if(!state.ach[a.id] && a.test(state)){
      state.ach[a.id] = true; state.stars += 1;
      setTimeout(()=>{ toast(`称号「<b>${a.n}</b>」を手に入れた　★+1`); SFX.star(); }, 900);
    }
  });
}

/* ================= guidance ================= */
function questTargetSub(q){
  if(!q) return null;
  if(q.target) return q.target;
  return state.found[q.via] ? null : q.via;
}
function nextStep(target){
  const av = available();
  if(!target || av.has(target)) return null;
  const reach = new Set(av), parent = {};
  let ch = true;
  while(ch){ ch=false;
    mapRules().forEach(r=>{
      if(r.cat && r.cat.includes("poly") && !state.cat.poly) return;
      if(r.in.every(i=>reach.has(i))) r.out.forEach(o=>{ if(!reach.has(o)){ reach.add(o); parent[o]=r; ch=true; } });
    });
  }
  if(!reach.has(target)) return null;
  let cur = target, guard = 0;
  while(guard++<20){
    const r = parent[cur]; if(!r) return null;
    const miss = r.in.find(i=>!av.has(i));
    if(!miss) return {id:cur, rule:r};
    cur = miss;
  }
  return null;
}

/* ================= render: map ================= */
function nodeState(id, av){
  if(av.has(id)) return RAWSRC[id] ? "raw" : "known";
  if(RAWSRC[id]){
    const src = SOURCES.find(z=>z.id===RAWSRC[id]);
    return src.by === "依頼"+(state.q+1) ? "locked" : "hidden";
  }
  if(mapRules().some(r=>r.out.includes(id) && ruleAvail(r,av))) return "front";
  return "hidden";
}
let vb = null, vbAnim = null;
function targetViewBox(ids){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  ids.forEach(id=>{ const [x,y]=P(id); x0=Math.min(x0,x-100); x1=Math.max(x1,x+100); y0=Math.min(y0,y-60); y1=Math.max(y1,y+50); });
  let w=Math.max(x1-x0,620), h=Math.max(y1-y0,1);
  const cx=(x0+x1)/2, cy=(y0+y1)/2, ar=1.6;
  if(w/h>ar) h=w/ar; else w=h*ar;
  if(h>=740){ h=740; w=h*ar; }
  const x = w>=980 ? (980-w)/2 : Math.max(0,Math.min(980-w,cx-w/2));
  const y = h>=740 ? 0 : Math.max(0,Math.min(740-h,cy-h/2));
  return [x,y,w,h];
}
function setViewBox(t){
  const svg=$("map");
  let reduce=false; try{ reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  if(!vb || reduce){ vb=t; svg.setAttribute("viewBox",t.join(" ")); return; }
  if(vb.every((v,i)=>Math.abs(v-t[i])<.5)) return;
  const from=vb.slice(), t0=performance.now(); cancelAnimationFrame(vbAnim);
  const step=now=>{ const k=Math.min(1,(now-t0)/650), e=1-Math.pow(1-k,3); vb=from.map((v,i)=>v+(t[i]-v)*e); svg.setAttribute("viewBox",vb.join(" ")); if(k<1) vbAnim=requestAnimationFrame(step); };
  vbAnim=requestAnimationFrame(step);
}
function renderMap(){
  const av = available();
  const st = {}; Object.keys(POS).forEach(id=>st[id]=nodeState(id,av));
  const q = QUESTS[state.q]; const qt = questTargetSub(q);
  const nx = nextStep(qt);
  const sel = ui.sel;
  let edges = "", chips = "", nodes = "";
  const bend = (a,b,k) => { const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, dx=b[0]-a[0], dy=b[1]-a[1]; return [mx - dy*k, my + dx*k]; };
  mapRules().forEach(r=>{
    const disc = !!state.rx[r.id], avl = ruleAvail(r,av);
    r.in.filter(i=>POS[i]).forEach(i=>{
      r.out.filter(o=>POS[o]).forEach(o=>{
        if(st[i]==="hidden"||st[o]==="hidden"||st[i]==="locked") return;
        let cls;
        if(disc) cls = "";
        else if(avl) cls = av.has(o) ? "alt" : "front";
        else return;
        const touch = sel && (sel===i || sel===o);
        const a = P(i), b = P(o), c = bend(a,b, r.id==="vc1" ? -.35 : .12);
        edges += `<path class="ed ${cls}${touch&&!cls?" hl":""}" d="M${a[0]} ${a[1]} Q${c[0]} ${c[1]} ${b[0]} ${b[1]}"/>`;
        if(touch){
          const mx = .25*a[0]+.5*c[0]+.25*b[0], my = .25*a[1]+.5*c[1]+.25*b[1] - (Math.abs(b[1]-a[1])<40 ? 27 : 0);
          const lv = state.clue[r.id]||0;
          const label = disc || lv>=2 ? edgeChip(r) : lv>=1 ? (r.in.filter(x=>!POS[x]).map(x=>"+"+S[x].f).join(" ")||"単独")+" …" : "？";
          const w = Math.max(24, [...label].length*7.4+14);
          chips += `<g><rect class="chip-bg" x="${mx-w/2}" y="${my-11}" width="${w}" height="22" rx="11"/><text class="chip-t" x="${mx}" y="${my+4}" text-anchor="middle">${label}</text></g>`;
        }
      });
    });
  });
  const shown = [];
  Object.keys(POS).forEach(id=>{
    const s = st[id]; if(s==="hidden") return;
    shown.push(id);
    const [x,y] = P(id);
    const src = RAWSRC[id] && SOURCES.find(z=>z.id===RAWSRC[id]);
    const label = s==="front" ? "？？？" : s==="locked" ? `${src.by}で解放` : shortName(id);
    const w = s==="front" ? 88 : Math.max(66, [...label].length*14.5 + 22);
    const isNext = nx && nx.id===id;
    const cls = ["mn", s==="raw"?"raw":"", s==="front"?"front":"", s==="locked"?"locked":"", sel===id?"sel":"", isNext?"next":""].join(" ");
    const rx = s==="raw"||s==="locked" ? 5 : 16;
    nodes += `<g class="${cls}" data-node="${id}" tabindex="0" role="button" aria-label="${s==="front"?"未発見の物質":label}" style="--cc:${s==="front"?"var(--accent)":cc(id)}">`;
    nodes += `<rect class="halo" x="${x-w/2-6}" y="${y-22}" width="${w+12}" height="44" rx="${rx+5}"/>`;
    nodes += `<rect class="body" x="${x-w/2}" y="${y-16}" width="${w}" height="32" rx="${rx}"/>`;
    nodes += `<text x="${x}" y="${y+5.5}" text-anchor="middle">${label}</text></g>`;
    const flagTxt = qt===id ? "依頼" : isNext ? "次の一歩" : "";
    if(flagTxt){
      const fw = flagTxt.length*12+16;
      nodes += `<g class="flag"><rect x="${x-fw/2}" y="${y-42}" width="${fw}" height="19" rx="4"/><text x="${x}" y="${y-28.5}" text-anchor="middle">${flagTxt}</text></g>`;
    }
  });
  const regions = REGIONS.map(r=>`<text class="region" x="${r[1]*K}" y="${r[2]*K+OY}">${r[0]}</text>`).join("");
  $("map").innerHTML = `${regions}<g>${edges}</g><g>${nodes}</g><g>${chips}</g>`;
  setViewBox(targetViewBox(shown));
  const nf = Object.values(st).filter(v=>v==="front").length;
  $("map-sub").textContent = nf ? `作れそうな「？」が ${nf}個` : "";
}

function slotHTML(k){
  const id = ui[k]; const lab = k==="a" ? "A" : "B（空でもよい）";
  if(!id) return `<span class="lab">${lab}</span><span class="empty">押して選ぶ</span>`;
  return `<span class="lab">${lab}</span><span class="nm" style="color:${cc(id)}">${shortName(id)}</span><span class="sf">${S[id].f}</span>`;
}
function tagHTML(id){
  const on = ui[ui.picking]===id;
  return `<button type="button" class="tag${on?" on":""}" data-pick="${id}" style="--cc:${cc(id)}"><span class="dot"></span>${shortName(id)}<span class="tf">${S[id].f}</span></button>`;
}
function renderPicker(){
  const el = $("picker"); const k = ui.picking;
  if(!k){ el.innerHTML = ""; return; }
  const srcItems = []; SOURCES.forEach(s=>{ if(state.src[s.id]) s.items.forEach(i=>{ if(!srcItems.includes(i)) srcItems.push(i); }); });
  const made = Object.keys(S).filter(i=>state.found[i] && !srcItems.includes(i));
  const extra = made.filter(i=>S[i].cls==="reagent"||S[i].cls==="inorg");
  const org = made.filter(i=>!extra.includes(i));
  let h = `<div class="picker"><div class="ph"><span>フラスコ${k.toUpperCase()}に入れる物質</span><span>${k==="b"?`<button type="button" class="btn ghost" data-pick="">空にする</button>`:""}<button type="button" class="btn ghost" data-pick-close>閉じる</button></span></div>`;
  h += `<h4>原料・試薬</h4><div class="tags">${srcItems.concat(extra).map(tagHTML).join("")}</div>`;
  h += `<h4>つくった物質</h4><div class="tags">${org.length?org.map(tagHTML).join(""):'<span class="muted" style="font-size:12.5px">まだありません</span>'}</div></div>`;
  el.innerHTML = h;
}
function renderBench(){
  ["a","b"].forEach(k=>{ const el=$("slot-"+k); el.innerHTML = slotHTML(k); el.classList.toggle("active", ui.picking===k); el.classList.toggle("filled", !!ui[k]); });
  renderPicker();
  $("temp").value = ui.temp; $("temp-v").textContent = ui.temp + "℃";
  $("light").setAttribute("aria-pressed", ui.light); $("light-t").textContent = ui.light ? "当てる" : "当てない";
  $("cat").innerHTML = CATS.map(c=>{ const locked = c.lock && !state.cat[c.id]; return `<option value="${c.id}"${locked?" disabled":""}${ui.cat===c.id?" selected":""}>${c.n}${locked?`（${c.lock}で解放）`:""}</option>`; }).join("");
  $("pred").innerHTML = `<option value="">予想しない</option>` + TYPES.map(t=>`<option value="${t}"${ui.pred===t?" selected":""}>${t}</option>`).join("");
  const fw = $("flask"); fw.classList.toggle("hot", ui.temp>=100); fw.classList.toggle("uvon", ui.light);
  renderResult();
}
function renderResult(){
  const el = $("result"); const R = ui.result;
  if(!R){ el.innerHTML = ""; return; }
  const {res,newSubs,newRx,predOk,star,pred,xp} = R;
  let h = "";
  if(res.kind==="ok"){
    const r = res.rule;
    h += `<div class="result ok"><h4>${newSubs.length?"新しい物質ができた！":newRx?"新しい反応を発見！":"反応した"}`;
    r.types.forEach(t=>h+=`<span class="chip type">${t}</span>`);
    if(predOk===true) h += `<span class="chip good">予想的中${star?" ★+1":""}</span>`;
    if(predOk===false) h += `<span class="chip miss">予想はずれ</span>`;
    if(xp) h += `<span class="chip xp">+${xp} XP</span>`;
    h += `</h4><div class="eq">${r.eq}</div><p>${r.text}</p><p class="tn">${TYPE_NOTE[r.types[0]]}</p></div>`;
  } else {
    h += `<div class="result ${res.kind==="fail"?"fail":""}"><h4>${res.kind==="fail"?"おしい！":"変化なし"}`;
    if(predOk===true) h += `<span class="chip good">予想どおり</span>`;
    h += `</h4><p>${res.msg}</p>${res.kind==="fail"?`<p class="tn">組み合わせは合っている。温度・光・触媒を見直そう。</p>`:""}</div>`;
  }
  el.innerHTML = h;
}
function renderSide(){
  const b = ui.side==="bench";
  $("look").hidden = b; $("bench").hidden = !b;
  $("seg-look").setAttribute("aria-selected", !b); $("seg-bench").setAttribute("aria-selected", b);
  if(b) renderBench(); else renderLook();
}

/* ================= render: header, quest, tabs ================= */
function renderHUD(){
  $("st-star").textContent = "★" + state.stars;
  const ri = rankIdx(state.xp); $("st-rank").textContent = RANKS[ri][1];
  const lo = RANKS[ri][0], hi = RANKS[ri+1] ? RANKS[ri+1][0] : null;
  $("st-xpbar").style.width = hi ? Math.round((state.xp-lo)/(hi-lo)*100)+"%" : "100%";
  $("st-xp").textContent = hi ? `${state.xp} / ${hi} XP` : `${state.xp} XP`;
  $("mute").textContent = "効果音：" + (state.mute ? "なし" : "あり");
}
function questReady(q){ return q.rx ? !!state.rx[q.rx] : !!state.found[q.target]; }
function renderQuest(){
  const el = $("qbar"); const done = state.q;
  if(done >= QUESTS.length){
    el.className = "panel qbar clear";
    el.innerHTML = `<div><div class="eyebrow">依頼 6/6 達成</div><h2>第1章クリア</h2><p class="say">マップに残る「？」を探して、図鑑と称号を集めよう。第2章「官能基の工房」は準備中。</p></div>`;
    return;
  }
  el.className = "panel qbar";
  const q = QUESTS[done]; const nh = state.hints[q.id]||0; const ready = questReady(q);
  let h = `<div><div class="eyebrow">依頼 ${done+1}/${QUESTS.length}　${q.who}より</div><h2>${q.title}</h2><p class="say">${q.say}</p></div>`;
  h += `<div class="acts"><button type="button" class="btn" id="hint"${nh>=q.hints.length?" disabled":""}>ヒント ${nh}/${q.hints.length}</button>`;
  h += `<button type="button" class="btn hot" id="deliver"${ready?"":" disabled"}>納品する</button></div>`;
  if(nh) h += `<ol>${q.hints.slice(0,nh).map(x=>`<li>${x}</li>`).join("")}</ol>`;
  el.innerHTML = h;
}
function renderTabs(){
  const d1 = DEX1.filter(i=>state.found[i]).length;
  $("t-dex").textContent = `${d1}/${DEX1.length}`;
  $("t-ach").textContent = `${ACH.filter(a=>state.ach[a.id]).length}/${ACH.length}`;
  $("t-log").textContent = state.log.length ? String(state.n) : "";
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===ui.tab));
  let h = "";
  if(ui.tab==="dex"){
    const item = id => state.found[id]
      ? `<button type="button" class="dex-i" data-open="${id}" style="--cc:${cc(id)}"><span class="df">${S[id].f}</span><span class="dn">${shortName(id)}</span></button>`
      : `<div class="dex-i unk"><span class="df">？</span><span class="dn">${SHORT[S[id].cls]}</span></div>`;
    h += `<div class="dex-sec"><span>第1章の物質</span><span>${d1}/${DEX1.length}</span></div><div class="dex">${DEX1.map(item).join("")}</div>`;
    h += `<div class="dex-sec"><span>ほかの章の先取り・副産物</span><span>${DEXX.filter(i=>state.found[i]).length}/${DEXX.length}</span></div><div class="dex">${DEXX.map(item).join("")}</div>`;
  } else if(ui.tab==="ach"){
    h += `<div class="ach">${ACH.map(a=>`<div class="badge ${state.ach[a.id]?"on":"off"}"><b>${state.ach[a.id]?a.n:"？？？"}</b><span>${a.d}</span></div>`).join("")}</div>`;
  } else {
    h += state.log.length ? `<ol class="log">${state.log.map(l=>`<li><span class="n">#${l.n}</span><span class="e">${l.eq}</span><span class="r ${l.ok?"ok":"no"}">${l.ok?"成功":"—"}</span></li>`).join("")}</ol>` : `<p class="muted" style="margin:0;font-size:13.5px">まだ実験していません。</p>`;
  }
  $("tabbody").innerHTML = h;
}
function renderAll(){ renderHUD(); renderQuest(); renderMap(); renderSide(); renderTabs(); if(!ui.result) paintFlaskIdle(); }

/* ---------- detail dialog ---------- */
function openDetail(id){
  const s = S[id]; const dlg = $("dlg");
  const made = RULES.filter(r=>state.rx[r.id] && r.out.includes(id));
  const used = RULES.filter(r=>state.rx[r.id] && r.in.includes(id));
  let h = `<div class="dlg-h"><div><h3>${s.n}</h3><div class="fm" style="--cc:${cc(id)}">${s.f}</div></div><button type="button" class="btn" id="dlg-x">閉じる</button></div>`;
  h += `<div class="mol">${s.smi?`<svg id="dlg-svg"></svg>`:`<div class="poly">${s.f}</div>`}</div>`;
  h += `<dl><dt>分類</dt><dd>${CLS[s.cls].label}</dd>`;
  if(DEPTH[id]) h += `<dt>レア度</dt><dd class="rar">${starsStr(rarity(id))}（原料から${DEPTH[id]}段）</dd>`;
  h += `<dt>解説</dt><dd>${s.note}</dd>`;
  if(s.use) h += `<dt>使い道</dt><dd>${s.use}</dd>`;
  if(made.length) h += `<dt>つくり方</dt><dd><ul>${made.map(r=>`<li>${r.eq}</li>`).join("")}</ul></dd>`;
  if(used.length) h += `<dt>使った反応</dt><dd><ul>${used.map(r=>`<li>${r.eq}</li>`).join("")}</ul></dd>`;
  h += `</dl>`;
  $("dlg-body").innerHTML = h;
  if(s.smi){ const svg=$("dlg-svg"); const bg=getComputedStyle(document.documentElement).getPropertyValue("--surface-2").trim(); if(!drawMol(svg, s.smi, bg)) svg.outerHTML = `<div class="poly">${s.f}</div>`; }
  $("dlg-x").onclick = ()=>dlg.close();
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
}

/* ================= events ================= */
function showSide(which){
  ui.side = which; renderSide();
  if(window.matchMedia("(max-width:979px)").matches){ const s=$("side"); if(s.scrollIntoView) s.scrollIntoView({behavior:"smooth",block:"start"}); }
}
function setFromRule(r){
  const lv = state.clue[r.id]||0;
  const main = r.in.find(i=>POS[i]) || r.in[0];
  const other = r.in.find(i=>i!==main) || null;
  ui.a = main; ui.b = lv>=1 ? other : null;
  ui.picking = lv>=1 ? null : (other ? "b" : null);
  if(lv>=2){ ui.light = !!r.light; ui.cat = r.cat ? r.cat[0] : "none"; ui.temp = r.t ? Math.round((r.t[0]+r.t[1])/20)*10 : 20; }
  ui.pred = ""; ui.result = null;
  SFX.click(); renderAll(); showSide("bench");
}
document.addEventListener("click", e=>{
  const t = e.target;
  const node = t.closest("[data-node]"); if(node){ ui.sel = node.dataset.node; SFX.click(); renderMap(); showSide("look"); return; }
  const sd = t.closest("[data-side]"); if(sd){ showSide(sd.dataset.side); return; }
  const tb = t.closest("[data-tab]"); if(tb){ ui.tab = tb.dataset.tab; renderTabs(); return; }
  const slot = t.closest(".slot"); if(slot){ const k=slot.dataset.slot; ui.picking = ui.picking===k ? null : k; renderBench(); return; }
  if(t.closest("[data-pick-close]")){ ui.picking=null; renderBench(); return; }
  const pk = t.closest("[data-pick]");
  if(pk){ const k=ui.picking; const id=pk.dataset.pick||null; ui[k]=id; if(k==="a"&&ui.b===id) ui.b=null; if(k==="b"&&ui.a===id) ui.b=null;
    ui.picking = (k==="a" && !ui.b) ? "b" : null; ui.result=null; $("err").textContent=""; SFX.click(); renderBench(); paintFlaskIdle(); return; }
  const toA = t.closest("[data-toa]"); if(toA){ ui.a = toA.dataset.toa; if(ui.b===ui.a) ui.b=null; ui.picking = ui.b ? null : "b"; ui.result=null; SFX.click(); renderAll(); showSide("bench"); return; }
  const clue = t.closest("[data-clue]");
  if(clue){ if(state.stars<1) return; const id=clue.dataset.clue; state.stars--; state.clue[id]=(state.clue[id]||0)+1; save(); SFX.star(); renderHUD(); renderMap(); renderLook(); return; }
  const set = t.closest("[data-set]"); if(set){ setFromRule(RULE[set.dataset.set]); return; }
  const op = t.closest("[data-open]"); if(op){ openDetail(op.dataset.open); return; }
  if(t.id==="hint"){ const q=QUESTS[state.q]; state.hints[q.id]=(state.hints[q.id]||0)+1; save(); renderQuest(); return; }
  if(t.id==="deliver"){ deliver(); return; }
  const menu = $("menu"); if(menu.open && !t.closest("#menu")) menu.open = false;
});
document.addEventListener("keydown", e=>{
  const node = e.target.closest && e.target.closest("[data-node]");
  if(node && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); ui.sel=node.dataset.node; renderMap(); showSide("look"); }
});
function deliver(){
  const q = QUESTS[state.q]; if(!q || !questReady(q)) return;
  const rank0 = rankIdx(state.xp);
  (q.reward.src||[]).forEach(s=>state.src[s]=true);
  (q.reward.cat||[]).forEach(c=>state.cat[c]=true);
  state.q++; state.xp += 50; state.stars += 2; ui.sel = null;
  checkAch(); save(); renderAll(); showSide("look");
  SFX.lvl();
  toast(`「${q.title}」を納品した！ <b>+50 XP ★+2</b><br>${q.rewardText}${q.id==="q6"?"！":"。"}`);
  if(rankIdx(state.xp)>rank0) setTimeout(()=>toast(`ランクアップ！ <b>${RANKS[rankIdx(state.xp)][1]}</b> になった`),700);
}
$("go").addEventListener("click", ()=>{ ui.picking=null; react(); });
$("temp").addEventListener("input", e=>{ ui.temp=+e.target.value; $("temp-v").textContent=ui.temp+"℃"; $("flask").classList.toggle("hot", ui.temp>=100); });
$("light").addEventListener("click", ()=>{ ui.light=!ui.light; SFX.click(); $("light").setAttribute("aria-pressed", ui.light); $("light-t").textContent = ui.light ? "当てる" : "当てない"; $("flask").classList.toggle("uvon", ui.light); });
$("cat").addEventListener("change", e=>{ ui.cat=e.target.value; });
$("pred").addEventListener("change", e=>{ ui.pred=e.target.value; });
$("mute").addEventListener("click", ()=>{ state.mute=!state.mute; save(); renderHUD(); if(!state.mute) SFX.click(); });
let resetArmed = false, resetT = null;
$("reset").addEventListener("click", e=>{
  if(!resetArmed){ resetArmed=true; e.target.textContent="本当に消す？もう一度押す"; resetT=setTimeout(()=>{resetArmed=false; e.target.textContent="最初からやり直す";},4000); return; }
  clearTimeout(resetT); resetArmed=false; e.target.textContent="最初からやり直す"; $("menu").open=false;
  state = fresh(); ui = freshUI(); vb = null;
  try{ localStorage.removeItem(KEY); }catch(err){}
  renderAll();
});

/* ================= boot ================= */
function start(data){
  load();
  if(data && data.ui) ui = Object.assign(ui, data.ui, {result:null});
  renderAll();
}
try{ window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(()=>({ui:{a:ui.a,b:ui.b,temp:ui.temp,light:ui.light,cat:ui.cat,pred:ui.pred,sel:ui.sel,side:ui.side,tab:ui.tab}})); }catch(e){}
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
</script>
